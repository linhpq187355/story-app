spring:
  application:
    name: story-app
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/story_app?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${MYSQL_USER:story_user}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:true}

app:
  upload:
    audio-dir: ${APP_UPLOAD_AUDIO_DIR:uploads/audio}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

logging:
  level:
    org.springframework.security: DEBUG